# Cloudflare Workers configuration for Sawtify Arabic STT
name = "sawtify-arabic-stt"
main = "src/worker.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI Binding
# Gives access to env.AI for running @cf/openai/whisper-large-v3-turbo
[ai]
binding = "AI"

# Static Assets (Frontend built files from npm run build)
[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true
